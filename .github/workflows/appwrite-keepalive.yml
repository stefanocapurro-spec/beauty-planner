name: Appwrite Keepalive

on:
  schedule:
    # Ogni 3 giorni alle 04:15 UTC — ben sotto la soglia dei 7 giorni di inattività
    - cron: '15 4 */3 * *'
  workflow_dispatch: {}   # permette di lanciarlo anche a mano dalla tab "Actions"

jobs:
  ping-appwrite:
    runs-on: ubuntu-latest
    steps:
      - name: Chiamata autenticata all'API Appwrite (list databases)
        run: |
          echo "Chiamo l'endpoint Appwrite per generare attività reale sul progetto..."
          response=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "${APPWRITE_ENDPOINT}/databases" \
            -H "X-Appwrite-Project: ${APPWRITE_PROJECT_ID}" \
            -H "X-Appwrite-Key: ${APPWRITE_API_KEY}" \
            -H "Content-Type: application/json")

          echo "HTTP status: $response"
          cat response.json

          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "Keepalive riuscito."
          else
            echo "Keepalive fallito con status $response"
            exit 1
          fi
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
