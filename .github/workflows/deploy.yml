name: Build & Deploy → GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build
        env:
          VITE_APPWRITE_ENDPOINT:           ${{ secrets.VITE_APPWRITE_ENDPOINT }}
          VITE_APPWRITE_PROJECT_ID:         ${{ secrets.VITE_APPWRITE_PROJECT_ID }}
          VITE_APPWRITE_DATABASE_ID:        ${{ secrets.VITE_APPWRITE_DATABASE_ID }}
          VITE_APPWRITE_COL_SERVICES:       ${{ secrets.VITE_APPWRITE_COL_SERVICES }}
          VITE_APPWRITE_COL_APPOINTMENTS:   ${{ secrets.VITE_APPWRITE_COL_APPOINTMENTS }}
          VITE_APPWRITE_COL_PAYMENTS:       ${{ secrets.VITE_APPWRITE_COL_PAYMENTS }}
          VITE_SUPERADMIN_EMAIL:            ${{ secrets.VITE_SUPERADMIN_EMAIL }}
          VITE_BASE_PATH:                   ${{ secrets.VITE_BASE_PATH || '/' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
