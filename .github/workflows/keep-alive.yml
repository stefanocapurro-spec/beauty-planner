name: Keep Appwrite Alive

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Appwrite
        run: |
          echo "🏓 Ping Appwrite — $(date)"

          # /v1/ping è l'endpoint pubblico senza autenticazione
          RESPONSE=$(curl -s \
            "https://cloud.appwrite.io/v1/ping")

          echo "Risposta: $RESPONSE"

          if echo "$RESPONSE" | grep -q "pong"; then
            echo "✅ Appwrite attivo"
          else
            echo "⚠️  Risposta inattesa, ma il progetto è stato contattato"
          fi

      - name: Ping database (autenticato)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "X-Appwrite-Project: ${{ secrets.VITE_APPWRITE_PROJECT_ID }}" \
            -H "X-Appwrite-Key: ${{ secrets.APPWRITE_API_KEY }}" \
            "https://cloud.appwrite.io/v1/databases")

          echo "Database ping — HTTP: $STATUS"

          # 200 = OK, 401 = credenziali errate, ma comunque il progetto è stato toccato
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
            echo "✅ Ping completato — progetto mantenuto attivo"
          else
            echo "⚠️  Risposta: $STATUS"
          fi
