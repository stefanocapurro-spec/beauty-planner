<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" rx="110" fill="#f5f0fa"/>

  <!-- Foglioline base -->
  <ellipse cx="100" cy="305" rx="78" ry="22" fill="#5c9e7a" opacity="0.7" transform="rotate(-18 100 305)"/>
  <ellipse cx="300" cy="305" rx="78" ry="22" fill="#5c9e7a" opacity="0.7" transform="rotate(18 300 305)"/>

  <!-- Petali posteriori lontani -->
  <ellipse cx="200" cy="108" rx="28" ry="88" fill="#c9a8e8" opacity="0.55" transform="rotate(-28 200 108)"/>
  <ellipse cx="200" cy="108" rx="28" ry="88" fill="#c9a8e8" opacity="0.55" transform="rotate(28 200 108)"/>
  <ellipse cx="200" cy="108" rx="22" ry="82" fill="#c9a8e8" opacity="0.55"/>

  <!-- Petali medi -->
  <ellipse cx="200" cy="130" rx="30" ry="100" fill="#b07fd4" opacity="0.75" transform="rotate(-18 200 130)"/>
  <ellipse cx="200" cy="130" rx="30" ry="100" fill="#b07fd4" opacity="0.75" transform="rotate(18 200 130)"/>

  <!-- Petali frontali -->
  <ellipse cx="200" cy="148" rx="32" ry="105" fill="#9558c2" opacity="0.88" transform="rotate(-8 200 148)"/>
  <ellipse cx="200" cy="148" rx="32" ry="105" fill="#9558c2" opacity="0.88" transform="rotate(8 200 148)"/>

  <!-- Petalo centrale -->
  <ellipse cx="200" cy="155" rx="34" ry="108" fill="#7e3aad" opacity="0.95"/>

  <!-- Calendario sfondo bianco -->
  <rect x="152" y="188" width="96" height="78" rx="10" fill="white"/>
  <!-- Header viola -->
  <rect x="152" y="188" width="96" height="24" rx="10" fill="#7e3aad"/>
  <rect x="152" y="200" width="96" height="12" fill="#7e3aad"/>
  <!-- Graffette -->
  <rect x="172" y="182" width="7" height="13" rx="3.5" fill="#5a2d88"/>
  <rect x="221" y="182" width="7" height="13" rx="3.5" fill="#5a2d88"/>
  <!-- Mese -->
  <text x="200" y="207" text-anchor="middle"
    font-family="Arial,sans-serif" font-size="11" font-weight="bold"
    fill="white" letter-spacing="2">APR</text>
  <!-- Numero giorno -->
  <text x="200" y="252" text-anchor="middle"
    font-family="Georgia,serif" font-size="42" font-weight="bold"
    fill="#2a1540">7</text>
</svg>
